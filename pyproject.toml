[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF", "LOG", "G", "PIE", "RET"]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.solaredge_v2", "tests"]
known-third-party = ["homeassistant", "pytest_homeassistant_custom_component"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RET504"]
