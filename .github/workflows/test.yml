# Runs lint and the pytest suite on every push and pull request.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # The harness pins the beta core it was cut from, so the stable core is
      # pinned in its own file and installed second; the assert proves it.
      - name: Install the test harness
        run: pip install -r requirements-dev.txt
      - name: Pin the stable core over the harness
        run: pip install -r requirements-core.txt
      - name: Verify runtime versions
        run: python -c "from importlib.metadata import version; import sys; print(version('homeassistant')); assert version('homeassistant') == '2026.10.0'; assert sys.version_info[:2] == (3, 14)"
      - name: Run the suite
        run: pytest -ra --strict-markers tests/
      - name: Lint
        if: always()
        run: ruff check .

