set_credits_used:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: solaredge_v2
    used:
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          mode: box
refresh:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: solaredge_v2
export_energy:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: solaredge_v2
    start_date:
      required: true
      selector:
        date:
    end_date:
      selector:
        date:
    days_per_call:
      default: 31
      selector:
        number:
          min: 1
          max: 366
          mode: box
